<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Roommates</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="shell">
    <section id="auth-view" class="auth card">
      <p class="eyebrow">Compartido</p>
      <h1>Roommates</h1>
      <div class="tabs">
        <button class="tab active" type="button" data-mode="login">Entrar</button>
        <button class="tab" type="button" data-mode="register">Crear cuenta</button>
      </div>
      <form id="auth-form">
        <label>Usuario <input name="username" required minlength="3" maxlength="20" autocomplete="username" /></label>
        <label>Contrasena <input name="password" type="password" required minlength="6" autocomplete="current-password" /></label>
        <p id="auth-error" class="error" hidden></p>
        <button id="auth-submit" class="primary" type="submit">Entrar</button>
      </form>
    </section>
    <section id="app-view" class="hidden">
      <header>
        <div><p class="eyebrow">Gastos y tareas</p><h1>Roommates</h1></div>
        <div class="who"><strong id="user-name"></strong><button id="logout" class="ghost" type="button">Salir</button></div>
      </header>
      <form id="task-form" class="card form">
        <input id="task-title" placeholder="Tarea" maxlength="60" required />
        <input id="task-assignee" placeholder="Asignada a" maxlength="20" />
        <button class="primary" type="submit">Crear tarea</button>
      </form>
      <div id="tasks"></div>
      <form id="expense-form" class="card form">
        <input id="exp-desc" placeholder="Gasto" maxlength="60" required />
        <input id="exp-amount" type="number" placeholder="Monto" step="0.01" />
        <input id="exp-paid" placeholder="Pagado por" maxlength="20" />
        <button class="primary" type="submit">Registrar gasto</button>
      </form>
      <div id="expenses"></div>
      <p id="form-error" class="error" hidden></p>
    </section>
  </main>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
